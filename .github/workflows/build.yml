name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 把 secret 提到 job 级别，才能用 env 判断是否配置了签名文件
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 只用官方 Gradle action：它自带 gradle 命令，不再依赖仓库里残缺的 gradlew
    - name: Set up Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # 兜底：确认 platform 34 和 build-tools 34 存在（runner 一般已预装）
    - name: Ensure Android SDK components
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon --stacktrace

    # 没有配置签名 secret 时自动跳过，不会让整个构建挂掉
    - name: Sign Release APK
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v -p 4 \
          app/build/outputs/apk/release/app-release-unsigned.apk \
          app/build/outputs/apk/release/app-release-aligned.apk
        ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
          --ks release.keystore \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEYSTORE_PASSWORD" \
          --ks-key-alias douyintv \
          --out app/build/outputs/apk/release/DouyinTV.apk \
          app/build/outputs/apk/release/app-release-aligned.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTV-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: DouyinTV-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
